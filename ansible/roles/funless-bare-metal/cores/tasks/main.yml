---
- name: get dependencies
  ansible.builtin.shell: mix deps.get
  args:
    chdir: "{{ ansible_env.HOME }}/funless/core"
  environment:
    PATH: "{{ ansible_env.HOME }}/.elixir-install/installs/elixir/1.18.3-otp-27/bin:{{ ansible_env.HOME }}/.elixir-install/installs/otp/27.1.2/bin:{{ ansible_env.PATH }}"

- name: compile core
  ansible.builtin.shell: mix compile
  args:
    chdir: "{{ ansible_env.HOME }}/funless/core"
  environment:
    PATH: "{{ ansible_env.HOME }}/.elixir-install/installs/elixir/1.18.3-otp-27/bin:{{ ansible_env.HOME }}/.elixir-install/installs/otp/27.1.2/bin:{{ ansible_env.PATH }}"
    MIX_ENV: "prod"
