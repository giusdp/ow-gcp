- name: Install PostgreSQL with pglogical
  apt:
    name:
      - postgresql
      - postgresql-contrib
      - python3-psycopg2
      - postgresql-common
      - postgresql-16-pglogical
    state: present
  become: true

- name: Configure postgresql.conf for PostgreSQL 16
  lineinfile:
    path: /etc/postgresql/16/main/postgresql.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - {
        regexp: "^#?shared_preload_libraries",
        line: "shared_preload_libraries = 'pglogical'",
      }
    - { regexp: "^#?wal_level", line: "wal_level = logical" }
    - { regexp: "^#?max_worker_processes", line: "max_worker_processes = 10" }
    - { regexp: "^#?max_replication_slots", line: "max_replication_slots = 10" }
    - { regexp: "^#?max_wal_senders", line: "max_wal_senders = 10" }
  become: true

- name: Restart PostgreSQL to load new shared_preload_libraries
  service:
    name: postgresql
    state: restarted
  become: true

- name: Create app user and database
  block:
    - name: Create app user
      postgresql_user:
        name: funless
        password: funless_password
        role_attr_flags: SUPERUSER,LOGIN
      become: true
      become_user: postgres

    - name: Create database
      postgresql_db:
        name: funless
        owner: funless
      become: true
      become_user: postgres

    - name: Enable pglogical extension in funless
      postgresql_ext:
        name: pglogical
        db: funless
      become: true
      become_user: postgres

- name: Setup pglogical on eu_controller
  postgresql_query:
    db: funless
    query: |
      SELECT pglogical.create_node(
        node_name := 'eu_node',
        dsn := 'host={{ hostvars["eu_controller"]["ansible_default_ipv4"]["address"] }} port=5432 dbname=funless user=funless password=funless_password'
      );
      SELECT pglogical.create_replication_set('default_set');
      SELECT pglogical.replication_set_add_all_tables('default_set', ARRAY['public']);
  become: true
  become_user: postgres
  when: inventory_hostname == 'eu_controller'

- name: Setup pglogical on us_controller
  postgresql_query:
    db: funless
    query: |
      SELECT pglogical.create_node(
        node_name := 'us_node',
        dsn := 'host={{ hostvars["us_controller"]["ansible_default_ipv4"]["address"] }} port=5432 dbname=funless user=funless password=funless_password'
      );
      SELECT pglogical.create_replication_set('default_set');
      SELECT pglogical.replication_set_add_all_tables('default_set', ARRAY['public']);
  become: true
  become_user: postgres
  when: inventory_hostname == 'us_controller'

- name: Configure PostgreSQL to listen on all interfaces
  lineinfile:
    path: /etc/postgresql/16/main/postgresql.conf
    regexp: "^#?listen_addresses"
    line: "listen_addresses = '*'"
  become: true

- name: Allow remote connections in pg_hba.conf
  blockinfile:
    path: /etc/postgresql/16/main/pg_hba.conf
    block: |
      # Allow connections from other servers for replication
      host    all             funless         10.128.0.0/16           md5
      host    replication     funless         10.128.0.0/16           md5
    marker: "# {mark} ANSIBLE MANAGED BLOCK FOR PGLOGICAL"
  become: true

- name: Restart PostgreSQL to apply network configuration
  service:
    name: postgresql
    state: restarted
  become: true

- name: Create subscription from eu to us
  postgresql_query:
    db: funless
    query: |
      SELECT pglogical.create_subscription(
        subscription_name := 'subscription_to_us',
        provider_dsn := 'host={{ hostvars["us_controller"]["ansible_default_ipv4"]["address"] }} port=5432 dbname=funless user=funless password=funless_password',
        replication_sets := ARRAY['default_set'],
        synchronize_structure := true,
        synchronize_data := true
      );
  become: true
  become_user: postgres
  when: inventory_hostname == 'eu_controller'

- name: Create subscription from us to eu
  postgresql_query:
    db: funless
    query: |
      SELECT pglogical.create_subscription(
        subscription_name := 'subscription_to_eu',
        provider_dsn := 'host={{ hostvars["eu_controller"]["ansible_default_ipv4"]["address"] }} port=5432 dbname=funless user=funless password=funless_password',
        replication_sets := ARRAY['default_set'],
        synchronize_structure := true,
        synchronize_data := true
      );
  become: true
  become_user: postgres
  when: inventory_hostname == 'us_controller'
