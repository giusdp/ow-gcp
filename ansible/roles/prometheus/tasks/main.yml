---
- name: Ensure prometheus group exists
  group:
    name: "{{ prometheus_group }}"
    state: present
  become: true

- name: Ensure prometheus user exists
  user:
    name: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    create_home: no
    system: true
  become: true

- name: Create Prometheus directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: "0755"
  loop:
    - "{{ prometheus_install_dir }}"
    - "{{ prometheus_data_dir }}"
    - "{{ prometheus_config_dir }}"
  become: true

- name: Download Prometheus tarball
  get_url:
    url: "{{ prometheus_download_url }}"
    dest: "/tmp/prometheus.tar.gz"
    mode: "0644"
  become: true

- name: Extract Prometheus tarball
  unarchive:
    src: "/tmp/prometheus.tar.gz"
    dest: "/tmp/"
    remote_src: true
    creates: "/tmp/{{ prometheus_extracted_dir }}"
  become: true

- name: Copy Prometheus binaries
  copy:
    src: "/tmp/{{ prometheus_extracted_dir }}/{{ item }}"
    dest: "{{ prometheus_install_dir }}/{{ item }}"
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: "0755"
  loop:
    - prometheus
    - promtool
  become: true

- name: Copy consoles and console libraries
  copy:
    src: "/tmp/{{ prometheus_extracted_dir }}/{{ item }}"
    dest: "{{ prometheus_install_dir }}/{{ item }}"
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: "0755"
  loop:
    - consoles
    - console_libraries
  become: true

- name: Deploy Prometheus configuration file
  template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_config_dir }}/prometheus.yml"
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: "0644"
  become: true

- name: Deploy Prometheus systemd service file
  template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Reload systemd daemon
  systemd:
    daemon_reload: true
  become: true

- name: Enable and start Prometheus service
  systemd:
    name: prometheus
    enabled: true
    state: started
  become: true
